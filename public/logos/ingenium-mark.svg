<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ing-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Luxury Gradient -->
    <linearGradient id="ing-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="ing-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Platinum Core -->
    <linearGradient id="ing-plat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="ing-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle / Shield Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ing-bg)" stroke="url(#ing-gold)" stroke-width="2" />
  
  <!-- Subtle Inner Tech Accent Ring -->
  <rect x="8" y="8" width="112" height="112" rx="26" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="6 4" />

  <!-- Architectural 'I' Capital Header (Top Bar) -->
  <path d="M42 28h44v7H42z" fill="url(#ing-gold)" />
  <path d="M50 35h28v4H50z" fill="url(#ing-plat)" opacity="0.8" />

  <!-- Left Code Bracket Wing < (Forms the architectural arch) -->
  <path d="M38 48L24 64l14 16h8L32 64l14-16h-8z" fill="url(#ing-cyan)" filter="url(#ing-glow)" />

  <!-- Right Code Bracket Wing > (Symmetric logic arch) -->
  <path d="M90 48l14 16-14 16h-8l14-16-14-16h8z" fill="url(#ing-cyan)" filter="url(#ing-glow)" />

  <!-- Central Monolith Pillar (The spine of Ingenium) -->
  <path d="M58 41h12v46H58z" fill="url(#ing-plat)" />
  <path d="M62 41h4v46h-4z" fill="#FFFFFF" />

  <!-- Radiant Core Spark (The Spark of Genius / Ingenium) -->
  <!-- 8-pointed star gem -->
  <g transform="translate(64, 64)">
    <circle r="9" fill="#0F172A" stroke="url(#ing-gold)" stroke-width="1.5" />
    <path d="M0 -7L1.8 -2.2L7 0L1.8 2.2L0 7L-1.8 2.2L-7 0L-1.8 -2.2Z" fill="url(#ing-gold)" />
    <circle r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Architectural 'I' Base Plinth (Bottom Bar) -->
  <path d="M50 89h28v4H50z" fill="url(#ing-plat)" opacity="0.8" />
  <path d="M42 93h44v7H42z" fill="url(#ing-gold)" />
</svg>